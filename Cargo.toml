[package]
name = "file-explorer"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.27"
egui_extras = { version = "0.27", features = ["all_loaders"] }
tokio = { version = "1", features = ["full"] }
walkdir = "2"
notify = "6"
winapi = { version = "0.3", features = ["winuser", "shellapi", "shlobj", "fileapi", "winbase", "winnt", "handleapi", "processthreadsapi"] }
mime_guess = "2"
chrono = "0.4"
rfd = "0.14"
arboard = "3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
regex = "1"
thiserror = "1"
image = "0.25"
dirs = "5"
uuid = { version = "1.0", features = ["v4", "serde"] }
git2 = "0.18"
syntect = "5.0"
ignore = "0.4"
sha2 = "0.10"
md5 = "0.7"
digest = "0.10"
serde_json = "1.0"
serde_yaml = "0.9"
sha1 = "0.10"
trash = "5.0"

